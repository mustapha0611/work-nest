name: worknest

services:
  db:
    image: postgres:18.6-alpine
    container_name: worknest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worknest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worknest_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-worknest}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - worknest_pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  worknest_pgdata:
